<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" fill="#F6F3EE"/>
  <!-- The ring: a subscription that keeps renewing, broken where you can cancel. -->
  <path d="M 790.2 419.6 A 300 300 0 1 1 624.4 253.8" fill="none" stroke="#1B1A18" stroke-width="88" stroke-linecap="round"/>
  <!-- The hand points at the moment to decide. -->
  <line x1="512" y1="532" x2="628.7" y2="415.3" stroke="#1B1A18" stroke-width="70" stroke-linecap="round"/>
  <circle cx="512" cy="532" r="52" fill="#1B1A18"/>
  <!-- The reminder: the BasisApps green dot, with a ring in the mark colour for contrast. -->
  <circle cx="724.1" cy="319.9" r="66" fill="#1B1A18"/>
  <circle cx="724.1" cy="319.9" r="46" fill="#22B573"/>
</svg>
