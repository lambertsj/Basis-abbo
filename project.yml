# Fallback for XcodeGen (https://github.com/yonaskolb/XcodeGen), a build-time tool only.
# Use it only if Opzegwekker.xcodeproj does not open: `xcodegen generate`.
name: Opzegwekker
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nl
settings:
  base:
    APP_BUNDLE_ID: nl.basisapps.opzegwekker
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Opzegwekker:
    type: application
    platform: iOS
    sources: [Opzegwekker, Shared, Catalog]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Config/Opzegwekker-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Opzegwekker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: Config/Opzegwekker.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: OpzegwekkerWidget
  OpzegwekkerWidget:
    type: app-extension
    platform: iOS
    sources: [OpzegwekkerWidget, Shared, Catalog]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        INFOPLIST_FILE: Config/OpzegwekkerWidget-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Opzegwekker
        CODE_SIGN_ENTITLEMENTS: Config/OpzegwekkerWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  OpzegwekkerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OpzegwekkerTests]
    dependencies:
      - target: Opzegwekker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Opzegwekker:
    build:
      targets:
        Opzegwekker: all
    test:
      targets: [OpzegwekkerTests]
